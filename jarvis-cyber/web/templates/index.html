<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S - AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #00d4ff;
            --secondary-color: #0099cc;
            --background-dark: #0a0e27;
            --background-darker: #050816;
            --background-light: #1a1f3a;
            --text-color: #e0e0e0;
            --text-muted: #8899aa;
            --success-color: #00ff88;
            --danger-color: #ff3366;
            --border-color: rgba(0, 212, 255, 0.3);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--background-darker);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 153, 204, 0.05) 0%, transparent 50%),
                        linear-gradient(135deg, var(--background-darker) 0%, var(--background-dark) 100%);
        }

        .circuit-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.05;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 79px, var(--primary-color) 79px, var(--primary-color) 81px),
                              repeating-linear-gradient(0deg, transparent, transparent 79px, var(--primary-color) 79px, var(--primary-color) 81px);
            animation: circuit-flow 30s linear infinite;
        }

        @keyframes circuit-flow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, 80px); }
        }

        .header {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-shadow: 0 0 20px var(--primary-color);
            letter-spacing: 4px;
        }

        .logo-pulse {
            width: 12px;
            height: 12px;
            background: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .header-btn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .header-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: #000;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        .sidebar-section {
            padding: 20px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 5px;
            border: 1px solid transparent;
        }

        .menu-item:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--border-color);
        }

        .menu-item.active {
            background: rgba(0, 212, 255, 0.15);
            border-color: var(--primary-color);
        }

        .menu-icon {
            font-size: 1.2rem;
        }

        .menu-label {
            flex: 1;
            font-size: 0.9rem;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .message {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            animation: messageSlideIn 0.4s ease;
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .assistant-avatar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .message-content {
            flex: 1;
            max-width: 800px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .message-author {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .message-text {
            background: rgba(26, 31, 58, 0.6);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .message.user .message-text {
            background: rgba(102, 126, 234, 0.15);
            border-color: rgba(102, 126, 234, 0.3);
        }

        .message.assistant .message-text {
            background: rgba(0, 212, 255, 0.08);
            border-color: var(--border-color);
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 15px 20px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .input-container {
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 20px 30px;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--background-light);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .input-box:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.95rem;
            resize: none;
            max-height: 200px;
            min-height: 24px;
            font-family: 'Roboto', sans-serif;
            line-height: 1.5;
        }

        .input-field:focus {
            outline: none;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .input-btn:hover {
            color: var(--primary-color);
            background: rgba(0, 212, 255, 0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #000;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 0.9rem;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .quick-action {
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quick-action:hover {
            background: rgba(0, 212, 255, 0.15);
            transform: translateY(-2px);
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            min-height: 400px;
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .welcome-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .welcome-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .feature-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-top: 30px;
        }

        .feature-card {
            background: rgba(26, 31, 58, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .feature-description {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 1000;
            }

            .sidebar.open {
                transform: translateX(280px);
            }

            .header {
                padding: 12px 20px;
            }

            .logo {
                font-size: 1.4rem;
            }

            .chat-messages {
                padding: 20px 15px;
            }

            .input-container {
                padding: 15px;
            }

            .feature-cards {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .header-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }

            .welcome-title {
                font-size: 1.5rem;
            }

            .input-field {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="circuit-lines"></div>

    <header class="header">
        <div class="logo-container">
            <button class="header-btn" id="menuToggle" style="display: none;">☰</button>
            <div class="logo">J.A.R.V.I.S</div>
            <div class="logo-pulse"></div>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="voiceBtn">🎤</button>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">+ Nova Conversa</button>
            </div>

            <div class="sidebar-section">
                <div class="menu-item active" data-feature="assistant">
                    <span class="menu-icon">💬</span>
                    <span class="menu-label">Chat</span>
                </div>
                <div class="menu-item" data-feature="scanner">
                    <span class="menu-icon">🔍</span>
                    <span class="menu-label">Scanner</span>
                </div>
                <div class="menu-item" data-feature="security">
                    <span class="menu-icon">🔒</span>
                    <span class="menu-label">Segurança</span>
                </div>
                <div class="menu-item" data-feature="projects">
                    <span class="menu-icon">📁</span>
                    <span class="menu-label">Projetos</span>
                </div>
            </div>
        </aside>

        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">🤖</div>
                    <h1 class="welcome-title">J.A.R.V.I.S</h1>
                    <p class="welcome-subtitle">Como posso ajudá-lo?</p>

                    <div class="feature-cards">
                        <div class="feature-card" onclick="sendQuickMessage('Scan')">
                            <div class="feature-icon">🔍</div>
                            <div class="feature-title">Scanner</div>
                        </div>
                        <div class="feature-card" onclick="sendQuickMessage('Criar website')">
                            <div class="feature-icon">🚀</div>
                            <div class="feature-title">Projetos</div>
                        </div>
                        <div class="feature-card" onclick="sendQuickMessage('Segurança')">
                            <div class="feature-icon">🛡️</div>
                            <div class="feature-title">Segurança</div>
                        </div>
                        <div class="feature-card" onclick="sendQuickMessage('Status')">
                            <div class="feature-icon">📊</div>
                            <div class="feature-title">Status</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="quick-actions">
                    <button class="quick-action" onclick="sendQuickMessage('Status')">📊 Status</button>
                    <button class="quick-action" onclick="sendQuickMessage('Scan')">🔍 Scan</button>
                    <button class="quick-action" onclick="sendQuickMessage('Website')">🌐 Website</button>
                    <button class="quick-action" onclick="sendQuickMessage('Segurança')">🔒 Segurança</button>
                </div>

                <div class="input-wrapper">
                    <div class="input-box">
                        <textarea 
                            class="input-field" 
                            id="messageInput" 
                            placeholder="Digite sua mensagem..."
                            rows="1"
                        ></textarea>
                        <div class="input-actions">
                            <button class="input-btn" id="voiceInputBtn">🎤</button>
                            <button class="send-btn" id="sendBtn">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        let socket;
        let messageHistory = [];

        try {
            socket = io.connect(location.protocol + '//' + document.domain + ':' + location.port);
            socket.on('connect', () => console.log('Conectado'));
            socket.on('scan_result', data => addMessage('assistant', 'Scan', formatScanResult(data)));
            socket.on('hardening_result', data => addMessage('assistant', 'Segurança', formatHardeningResult(data)));
        } catch (e) {}

        const messageInput = document.getElementById('messageInput');
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            document.getElementById('welcomeScreen').style.display = 'none';
            addMessage('user', 'Você', message);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            processCommand(message);
        }

        function sendQuickMessage(msg) {
            messageInput.value = msg;
            sendMessage();
        }

        function addMessage(type, author, content) {
            const container = document.getElementById('chatMessages');
            const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `
                <div class="message-avatar ${type}-avatar">${type === 'user' ? '👤' : '🤖'}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-author">${author}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text">${content}</div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator active';
            div.id = 'typing';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            document.getElementById('chatMessages').appendChild(div);
        }

        function hideTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function processCommand(cmd) {
            showTyping();
            const lower = cmd.toLowerCase();

            // Status
            if (lower.includes('status')) {
                setTimeout(() => {
                    hideTyping();
                    addMessage('assistant', 'JARVIS', `
                        🟢 <strong>Sistema OK</strong><br><br>
                        ✅ Tudo funcionando normalmente
                    `);
                }, 800);
                return;
            }

            // Scan de rede
            if (lower.includes('scan') || lower.includes('escanear') || lower.includes('rede')) {
                const target = '127.0.0.1';
                try {
                    const res = await fetch('/api/scan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target })
                    });
                    const data = await res.json();
                    hideTyping();
                    addMessage('assistant', 'JARVIS', formatScanResult(data));
                } catch (e) {
                    hideTyping();
                    addMessage('assistant', 'JARVIS', '❌ Erro ao executar scan');
                }
                return;
            }

            // Criar projeto
            if (lower.includes('criar') || lower.includes('projeto') || lower.includes('website') || lower.includes('site')) {
                setTimeout(() => {
                    hideTyping();
                    addMessage('assistant', 'JARVIS', `
                        🚀 <strong>Criar Projeto</strong><br><br>
                        🌐 Website<br>
                        ⚡ API<br>
                        📱 App Mobile<br>
                        🤖 ML/AI
                    `);
                }, 800);
                return;
            }

            // Segurança
            if (lower.includes('segur') || lower.includes('hardening') || lower.includes('análise')) {
                try {
                    const res = await fetch('/api/hardening', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json();
                    hideTyping();
                    addMessage('assistant', 'JARVIS', formatHardeningResult(data));
                } catch (e) {
                    hideTyping();
                    addMessage('assistant', 'JARVIS', '❌ Erro na análise');
                }
                return;
            }

            // Saudações
            if (lower.includes('olá') || lower.includes('oi') || lower.includes('hello')) {
                setTimeout(() => {
                    hideTyping();
                    addMessage('assistant', 'JARVIS', `
                        👋 Olá! Sou o JARVIS.<br>
                        Como posso ajudar?
                    `);
                }, 800);
                return;
            }

            // Resposta padrão
            setTimeout(() => {
                hideTyping();
                addMessage('assistant', 'JARVIS', `
                    Digite:<br>
                    • "scan" - analisar rede<br>
                    • "segurança" - análise<br>
                    • "criar projeto"<br>
                    • "status"
                `);
            }, 800);
        }

        function formatScanResult(data) {
            if (!data || !data.hosts) return 'Nenhum resultado';
            let r = '🔍 <strong>Scan Completo</strong><br><br>';
            data.hosts.forEach(h => {
                r += `Host: ${h.ip}<br>`;
                r += `Status: ${h.status}<br>`;
                if (h.ports) r += `Portas: ${h.ports.join(', ')}<br>`;
                r += '<br>';
            });
            return r;
        }

        function formatHardeningResult(data) {
            if (!data) return '❌ Erro';
            return `🛡️ <strong>Análise de Segurança</strong><br><br>Score: ${data.overall_score || 0}/100`;
        }

        // Menu toggle
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // Menu items
        document.querySelectorAll('.menu-item[data-feature]').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                const feature = this.dataset.feature;
                
                // Mensagem baseada na funcionalidade
                let msg = '';
                switch(feature) {
                    case 'assistant': msg = 'Olá'; break;
                    case 'security': msg = 'Segurança'; break;
                    case 'scanner': msg = 'Scan'; break;
                    case 'projects': msg = 'Criar projeto'; break;
                }
                if (msg) sendQuickMessage(msg);
            });
        });

        // New chat
        document.getElementById('newChatBtn').addEventListener('click', () => {
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('welcomeScreen').style.display = 'flex';
            messageHistory = [];
        });

        // Voice button (header)
        document.getElementById('voiceBtn').addEventListener('click', () => {
            if ('webkitSpeechRecognition' in window) {
                const rec = new webkitSpeechRecognition();
                rec.lang = 'pt-BR';
                rec.continuous = false;
                rec.start();
                document.getElementById('voiceBtn').style.borderColor = 'var(--danger-color)';
                rec.onresult = e => {
                    messageInput.value = e.results[0][0].transcript;
                    document.getElementById('voiceBtn').style.borderColor = '';
                    sendMessage();
                };
                rec.onerror = () => document.getElementById('voiceBtn').style.borderColor = '';
            } else {
                alert('Reconhecimento de voz não disponível neste navegador');
            }
        });

        // Voice input button
        if ('webkitSpeechRecognition' in window) {
            const rec = new webkitSpeechRecognition();
            rec.lang = 'pt-BR';
            rec.continuous = false;
            
            document.getElementById('voiceInputBtn').addEventListener('click', () => {
                rec.start();
                document.getElementById('voiceInputBtn').style.color = 'var(--danger-color)';
            });
            
            rec.onresult = e => {
                messageInput.value = e.results[0][0].transcript;
                document.getElementById('voiceInputBtn').style.color = '';
            };
            
            rec.onerror = () => {
                document.getElementById('voiceInputBtn').style.color = '';
            };
        } else {
            document.getElementById('voiceInputBtn').style.opacity = '0.5';
            document.getElementById('voiceInputBtn').title = 'Voz não disponível';
        }

        // Mobile detection
        if (window.innerWidth <= 768) {
            document.getElementById('menuToggle').style.display = 'block';
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth <= 768) {
                document.getElementById('menuToggle').style.display = 'block';
            } else {
                document.getElementById('menuToggle').style.display = 'none';
                document.getElementById('sidebar').classList.remove('open');
            }
        });

        // Close sidebar when clicking outside (mobile)
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                const menuToggle = document.getElementById('menuToggle');
                if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });

        // Auto-scroll chat
        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        // Notification system
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 80px;
                right: 20px;
                background: var(--background-light);
                border: 1px solid ${type === 'success' ? 'var(--success-color)' : type === 'error' ? 'var(--danger-color)' : 'var(--border-color)'};
                border-radius: 12px;
                padding: 15px 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                z-index: 2000;
                animation: slideInRight 0.3s ease;
                max-width: 350px;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Log initial connection
        console.log('🤖 JARVIS Interface carregada');
        console.log('📱 Versão Mobile-Optimized');
    </script>
</body>
</html>
